name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "app/frontend/**"
      - "helm/frontend-chart/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  build-scan-push-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.IMAGE_TAG }}

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

      - name: Update frontend Helm image values
        run: |
          sed -i "s|repository: .*frontend.*|repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}|g" helm/frontend-chart/values.yaml
          sed -i "s|tag: .*|tag: ${{ env.IMAGE_TAG }}|g" helm/frontend-chart/values.yaml

      - name: Commit updated frontend image tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/frontend-chart/values.yaml
          git commit -m "Update frontend image tag to ${{ env.IMAGE_TAG }}" || echo "No changes to commit"
          git push
