apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Bobysoni199/k8s-argocd.git
    targetRevision: main
    path: helm/frontend-chart
    helm:
      valueFiles:
        - values.yaml
        - environments/values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
