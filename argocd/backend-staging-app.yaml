apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Bobysoni199/k8s-argocd.git
    targetRevision: main
    path: helm/backend-chart
    helm:
      valueFiles:
        - values.yaml
        - environments/values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
